[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-office-agent"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for MS Office automation (Word, Excel, PowerPoint)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gurteggsinghh" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mcp-office-agent = "mcp_office_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_office_agent"]
